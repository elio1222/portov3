[build]
    publish = "."
    functions = "netlify/functions"

[functions."oura-refresh"]
    # Netlify crons are UTC: 13:00 = 9am EDT, 14:00 = 9am EST. Both run so the
    # card is refreshed at 9am year-round (the second run is a harmless re-fetch).
    schedule = "0 13,14 * * *"

# Static assets: cache in the browser to save bandwidth credits. Filenames are
# not hashed, so keep lifetimes short enough that edits show up.
[[headers]]
    for = "/images/*"
    [headers.values]
        Cache-Control = "public, max-age=604800"

[[headers]]
    for = "/gallery/*"
    [headers.values]
        Cache-Control = "public, max-age=604800"

[[headers]]
    for = "/styles/*"
    [headers.values]
        Cache-Control = "public, max-age=3600"

[[headers]]
    for = "/js/*"
    [headers.values]
        Cache-Control = "public, max-age=3600"
