<text x="278" y="180" font-size="16" fill="#fff">How do I back up</text><text x="278" y="204" font-size="16" fill="#fff" fill-opacity="0.85">my database?</text><rect x="80" y="246" width="360" height="98" rx="16" fill="#1f1d3a" fill-opacity="1" stroke="#fff" stroke-opacity="0.1"/>
<text x="98" y="276" font-size="16" fill="#fff">Snapshot the volume, then</text><text x="98" y="300" font-size="16" fill="#fff" fill-opacity="0.85">sync the archive to S3 with</text><text x="98" y="330" font-size="16" fill="#fff" fill-opacity="0.85">the AWS CLI.</text><rect x="260" y="366" width="300" height="74" rx="16" fill="#ff5a1f" fill-opacity="0.95" stroke="#fff" stroke-opacity="0"/>
<text x="278" y="396" font-size="16" fill="#fff">Thanks! Show the</text><text x="278" y="420" font-size="16" fill="#fff" fill-opacity="0.85">command.</text><rect x="80" y="476" width="400" height="44" rx="22" fill="#fff" fill-opacity="0.07" stroke="#fff" stroke-opacity="0.12"/><text x="104" y="504" font-size="15" fill="#fff" fill-opacity="0.45">Message the model…</text><circle cx="540" cy="498" r="22" fill="#e11d48"/><path d="M531 498H549M543 491L550 498L543 505" stroke="#fff" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/><g transform="translate(60 585)"><rect width="190" height="30" rx="15" fill="#22c55e" fill-opacity="0.18" stroke="#22c55e" stroke-opacity="0.5"/><circle cx="18" cy="15" r="5" fill="#22c55e"/><text x="32" y="20" font-size="13" fill="#bbf7d0">authenticated session</text></g></g></svg>